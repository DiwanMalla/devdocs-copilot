<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">DevDocs Copilot architecture</title>
  <desc id="desc">Public GitHub repositories are ingested into commit-pinned snapshots, chunked, embedded, and stored in Supabase PostgreSQL with pgvector. Questions retrieve those chunks and an OpenRouter model answers with exact file and line citations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1.5 L9 5 L0 8.5 z" fill="#737373"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="24" fill="#171717"/>
  <rect x="1" y="1" width="958" height="438" rx="23" fill="none" stroke="#404040"/>

  <text x="40" y="42" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Commit-pinned RAG workspace</text>
  <text x="40" y="64" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">GitHub source becomes a private, cited knowledge base</text>

  <rect x="40" y="92" width="160" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="120" y="120" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">GitHub repo</text>
  <text x="120" y="140" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">public snapshot</text>
  <path d="M200 126h38" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="248" y="92" width="160" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="328" y="120" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Ingest + filter</text>
  <text x="328" y="140" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">commit SHA pinned</text>
  <path d="M408 126h38" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="456" y="92" width="160" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="536" y="120" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Chunk + embed</text>
  <text x="536" y="140" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">1,536-d vectors</text>
  <path d="M616 126h38" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="664" y="92" width="256" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="792" y="120" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Supabase Postgres</text>
  <text x="792" y="140" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">pgvector HNSW + RLS</text>

  <path d="M792 160v48" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="224" width="160" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="120" y="252" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Ask a question</text>
  <text x="120" y="272" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">authenticated or demo</text>
  <path d="M200 258h38" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="248" y="224" width="160" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="328" y="252" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Hybrid retrieve</text>
  <text x="328" y="272" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">vector + lexical</text>
  <path d="M408 258h38" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="456" y="224" width="160" height="68" rx="14" fill="#262626" stroke="#404040"/>
  <text x="536" y="252" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">OpenRouter LLM</text>
  <text x="536" y="272" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">evidence-only prompt</text>
  <path d="M616 258h38" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="664" y="224" width="256" height="68" rx="14" fill="#262626" stroke="#525252"/>
  <text x="792" y="252" text-anchor="middle" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Cited answer</text>
  <text x="792" y="272" text-anchor="middle" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">[file.ts:L12-L34] opens explorer</text>

  <text x="40" y="348" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Next.js App Router</text>
  <text x="178" y="348" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Supabase Auth + RLS</text>
  <text x="332" y="348" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">OpenRouter embeddings + chat</text>
  <text x="548" y="348" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Durable ingest jobs</text>
  <text x="698" y="348" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">CI: supabase db reset + migrations</text>

  <text x="40" y="392" fill="#737373" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Self-hosted SVG so the diagram renders under a nonce CSP (no third-party scripts or mermaid CDN).</text>
</svg>
